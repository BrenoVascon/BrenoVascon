name: Arcane Stats

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 06:00 UTC
  workflow_dispatch:       # botão "Run workflow" na aba Actions
  push:
    branches: [main, master]
    paths: [".github/workflows/arcane-states.yml"]

permissions:
  contents: write

concurrency:          # evita duas execuções ao mesmo tempo
  group: arcane-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Summon arcane stats
        env:
          # Com o secret ARCANE_TOKEN (seu token pessoal) inclui repos privados.
          # Sem ele, usa o token automático e mostra só dados públicos.
          GITHUB_TOKEN: ${{ secrets.ARCANE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          INCLUDE_ORG_REPOS: "true"   # "false" = só repos seus (ignora os de organizações)
          EXCLUDE_LANGS: ""           # ex.: "HTML,SCSS" para esconder linguagens
        run: |
          python3 - <<'PY'
          import json, math, os, random, sys, urllib.request, urllib.parse

          USER = os.environ.get("GH_USER") or os.environ.get("GITHUB_REPOSITORY_OWNER")
          TOKEN = os.environ.get("GITHUB_TOKEN", "")
          OUT = os.environ.get("OUT", "assets/arcane-stats.svg")
          MONO = "'DejaVu Sans Mono',Consolas,'Courier New',monospace"

          INCLUDE_ORGS = os.environ.get("INCLUDE_ORG_REPOS", "true").lower() == "true"
          EXCLUDE = {x.strip().lower() for x in os.environ.get("EXCLUDE_LANGS", "").split(",") if x.strip()}

          def _req(url, data=None):
              req = urllib.request.Request(url if url.startswith("http") else "https://api.github.com" + url, data=data, headers={
                  "Accept": "application/vnd.github+json", "User-Agent": "arcane-stats"})
              if TOKEN:
                  req.add_header("Authorization", "Bearer " + TOKEN)
              if data:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def api(path):
              return _req(path)

          def gql(query, variables):
              res = _req("/graphql", json.dumps({"query": query, "variables": variables}).encode())
              if res.get("errors"):
                  raise RuntimeError(res["errors"])
              return res["data"]

          def count(q):
              return api("/search/" + q + "&per_page=1")["total_count"]

          CONTRIB_Q = """query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){
          totalCommitContributions totalPullRequestContributions totalIssueContributions totalPullRequestReviewContributions restrictedContributionsCount}}}"""

          def contributions(u, created):
              import datetime as dt
              start = dt.datetime.fromisoformat(created.replace("Z", "+00:00"))
              now = dt.datetime.now(dt.timezone.utc)
              tot = dict(commits=0, prs=0, issues=0, reviews=0, private=0)
              while start < now:
                  end = min(start + dt.timedelta(days=365), now)
                  c = gql(CONTRIB_Q, {"login": u, "from": start.isoformat(), "to": end.isoformat()})["user"]["contributionsCollection"]
                  tot["commits"] += c["totalCommitContributions"]
                  tot["prs"] += c["totalPullRequestContributions"]
                  tot["issues"] += c["totalIssueContributions"]
                  tot["reviews"] += c["totalPullRequestReviewContributions"]
                  tot["private"] += c["restrictedContributionsCount"]
                  start = end
              return tot

          def gather(u):
              user = api(f"/users/{u}")
              me = None
              try:
                  me = api("/user")
              except Exception:
                  pass
              private = bool(me) and me.get("login", "").lower() == u.lower()
              if private:
                  aff = "owner,collaborator,organization_member" if INCLUDE_ORGS else "owner"
                  base = f"/user/repos?per_page=100&visibility=all&affiliation={aff}&sort=pushed"
              else:
                  base = f"/users/{u}/repos?per_page=100&type=owner&sort=pushed"
              repos, page = [], 1
              while page <= 5:
                  batch = api(f"{base}&page={page}")
                  repos += batch
                  if len(batch) < 100:
                      break
                  page += 1
              own = [r for r in repos if not r["fork"]]
              langs = {}
              for r in own[:80 if private else 40]:
                  try:
                      for k, v in api(r["languages_url"]).items():
                          if k.lower() not in EXCLUDE:
                              langs[k] = langs.get(k, 0) + v
                  except Exception:
                      pass
              try:
                  c = contributions(u, user["created_at"])
                  commits, prs, issues = c["commits"] + c["private"], c["prs"], c["issues"]
              except Exception as e:
                  print("GraphQL indisponível, usando busca pública:", e)
                  q = urllib.parse.quote
                  commits = count("commits?q=" + q(f"author:{u}"))
                  prs = count("issues?q=" + q(f"author:{u} type:pr"))
                  issues = count("issues?q=" + q(f"author:{u} type:issue"))
              return dict(
                  stars=sum(r["stargazers_count"] for r in own if r["owner"]["login"].lower() == u.lower()),
                  commits=commits, prs=prs, issues=issues,
                  repos=user["public_repos"] + ((me or {}).get("owned_private_repos", 0) if private else 0),
                  followers=user["followers"],
                  langs=langs, private=private,
              )

          LANG_COLORS = {"Liquid": "#67b8de", "TypeScript": "#3178c6", "JavaScript": "#f1e05a", "CSS": "#8b5cf6",
              "SCSS": "#c6538c", "HTML": "#e34c26", "Python": "#3572a5", "Vue": "#41b883", "Shell": "#89e051",
              "PHP": "#4f5d95", "Ruby": "#cc342d", "Java": "#b07219", "Go": "#00add8", "Rust": "#dea584"}
          FALLBACK = ["#5ee7ff", "#f4cc70", "#95bf47", "#a78bfa", "#f472b6"]

          def title_for(lv):
              for limit, name in ((10, "APPRENTICE"), (20, "ADEPT"), (35, "SORCERER"), (50, "ARCHMAGE")):
                  if lv < limit:
                      return name
              return "SHOPIFY WIZARD"

          def esc(s):
              return str(s).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          def fmt(n):
              return f"{n/1000:.1f}k" if n >= 10000 else f"{n:,}".replace(",", ".")

          def render(d):
              W, H = 908, 236
              rnd = random.Random(7)
              xp = d["commits"] + 3 * d["prs"] + 2 * d["issues"] + 5 * d["stars"] + 2 * d["repos"] + d["followers"]
              lv = int(math.sqrt(xp))
              prog = (xp - lv * lv) / max(1, (lv + 1) ** 2 - lv * lv)
              el = []
              for _ in range(46):
                  x, y = rnd.uniform(8, W - 8), rnd.uniform(8, H - 8)
                  el.append(f'<rect class="tw" style="animation-delay:{-rnd.uniform(0,3):.2f}s" x="{x:.0f}" y="{y:.0f}" width="2" height="2" fill="#d9d4ff"/>')
              el.append(f'<text class="ttl" x="28" y="40">✦ ARCANE STATS</text>')
              if d.get("private"):
                  el.append(f'<text class="sm" x="30" y="62">PUBLIC + PRIVATE REALMS</text>')
              # nível + XP
              el.append(f'<text class="lv" x="{W-28}" y="40" text-anchor="end">LV {lv} · {title_for(lv)}</text>')
              el.append(f'<rect x="{W-268}" y="50" width="240" height="8" rx="4" fill="#1c1642" stroke="#3b2f6b"/>')
              el.append(f'<rect class="grow" x="{W-268}" y="50" width="{max(6,240*prog):.1f}" height="8" rx="4" fill="url(#xp)"/>')
              el.append(f'<text class="sm" x="{W-268}" y="74">XP {fmt(xp)}</text>')
              # atributos
              rows = [("Stars earned", d["stars"], "#f4cc70"), ("Commits cast", d["commits"], "#5ee7ff"),
                      ("Pull requests", d["prs"], "#a78bfa"), ("Issues opened", d["issues"], "#f472b6"),
                      ("Repositories", d["repos"], "#95bf47"), ("Followers", d["followers"], "#fda4af")]
              for i, (lab, val, col) in enumerate(rows):
                  y = 100 + i * 22
                  el.append(f'<g class="in" style="animation-delay:{i*0.12:.2f}s"><rect x="30" y="{y-9}" width="8" height="8" fill="{col}" transform="rotate(45 34 {y-5})"/>'
                            f'<text class="lb" x="50" y="{y}">{lab}</text><text class="val" x="396" y="{y}" text-anchor="end">{fmt(val)}</text></g>')
              el.append('<rect x="430" y="86" width="2" height="130" fill="#3b2f6b"/>')
              # linguagens
              total = sum(d["langs"].values()) or 1
              top = sorted(d["langs"].items(), key=lambda kv: -kv[1])[:5]
              el.append('<text class="sm" x="462" y="100">TOP LANGUAGES · MANA</text>')
              if not top:
                  el.append('<text class="lb" x="462" y="130">no spells recorded yet...</text>')
              for i, (name, b) in enumerate(top):
                  y = 124 + i * 21; pct = 100 * b / total
                  col = LANG_COLORS.get(name, FALLBACK[i % len(FALLBACK)])
                  el.append(f'<text class="lb" x="462" y="{y}">{esc(name)}</text>'
                            f'<rect x="576" y="{y-9}" width="240" height="9" rx="4" fill="#1c1642"/>'
                            f'<rect class="grow" style="animation-delay:{0.3+i*0.15:.2f}s" x="576" y="{y-9}" width="{max(4,240*pct/100):.1f}" height="9" rx="4" fill="{col}"/>'
                            f'<text class="val" x="{W-28}" y="{y}" text-anchor="end">{pct:.1f}%</text>')
              css = f"""
          .tw{{animation:tw 3s ease-in-out infinite}}@keyframes tw{{0%,100%{{opacity:.1}}50%{{opacity:.8}}}}
          .grow{{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}}@keyframes grow{{from{{transform:scaleX(0)}}to{{transform:scaleX(1)}}}}
          .in{{animation:in .6s ease-out both}}@keyframes in{{from{{opacity:0;transform:translateX(-8px)}}to{{opacity:1;transform:none}}}}
          .ttl{{font:700 16px {MONO};fill:#f4cc70;letter-spacing:5px}}
          .lv{{font:700 15px {MONO};fill:#5ee7ff;letter-spacing:3px}}
          .sm{{font:600 11px {MONO};fill:#8a82b8;letter-spacing:3px}}
          .lb{{font:600 13px {MONO};fill:#d9d4ff}}
          .val{{font:700 13px {MONO};fill:#ffffff}}"""
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}"><style>{css}</style>
          <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c20"/><stop offset=".6" stop-color="#171238"/><stop offset="1" stop-color="#24163f"/></linearGradient>
          <linearGradient id="xp" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#5ee7ff"/></linearGradient></defs>
          <rect width="{W}" height="{H}" rx="18" fill="url(#bg)" stroke="#3b2f6b" stroke-width="2"/>{"".join(el)}</svg>'''

          if __name__ == "__main__":
              if not USER:
                  sys.exit("GH_USER não definido")
              data = gather(USER)
              os.makedirs(os.path.dirname(OUT) or ".", exist_ok=True)
              open(OUT, "w", encoding="utf-8").write(render(data))
              print("arcane stats atualizados para", USER, {k: v for k, v in data.items() if k != "langs"}, "linguagens:", len(data["langs"]))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/arcane-stats.svg
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "✦ update arcane stats"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            echo "Push rejeitado, tentando de novo ($i/3)..."; sleep 5
          done
          exit 1
