<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="30" viewBox="0 0 1200 30"><style>
.sk{animation:sk 4.5s linear infinite}@keyframes sk{0%{transform:translateX(0);opacity:0}10%,90%{opacity:1}100%{transform:translateX(1080px);opacity:0}}
.skr{animation:skr 6s linear infinite}@keyframes skr{0%{transform:translateX(0);opacity:0}10%,90%{opacity:1}100%{transform:translateX(-1080px);opacity:0}}
.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{0%,100%{opacity:.5}50%{opacity:1}}
</style><defs><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".3" stop-color="#7c3aed"/><stop offset=".5" stop-color="#5ee7ff"/><stop offset=".7" stop-color="#7c3aed"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
<filter id="b" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<rect x="60" y="14" width="1080" height="2" fill="url(#l)"/>
<g class="sk"><ellipse cx="60" cy="15" rx="18" ry="3" fill="#a5f3fc" filter="url(#b)"/><rect x="56" y="13" width="8" height="4" fill="#fff"/></g>
<g class="skr"><ellipse cx="1140" cy="15" rx="14" ry="3" fill="#f4cc70" filter="url(#b)"/><rect x="1137" y="13" width="6" height="4" fill="#fff6c8"/></g>
<g class="pu"><rect x="591" y="6" width="18" height="18" transform="rotate(45 600 15)" fill="#1a1238" stroke="#f4cc70" stroke-width="2"/><rect x="597" y="12" width="6" height="6" transform="rotate(45 600 15)" fill="#5ee7ff"/></g>
</svg>